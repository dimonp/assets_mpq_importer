name: "Building"
on:
  pull_request:
  release:
    types: [published]
  push:
    branches:
      - main
      - master
      - develop

env:
  CLANG_TIDY_VERSION: "19"
  VERBOSE: 1

jobs:
  Build:
    runs-on: ${{ matrix.os }}
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    permissions:
      actions: read
      contents: read

    strategy:
      fail-fast: false

      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_type:
          - Release

        include:
          - os: ubuntu-latest
            generator: "Ninja Multi-Config"
            compiler: gcc-14
            build_type: Release
            package_generator: TGZ

          - os: windows-latest
            compiler: msvc
            generator: "Visual Studio 17 2022"
            build_type: Release
            package_generator: ZIP

    env:
      VCPKG_ROOT: $HOME/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/.vcpkg,readwrite
      VCPKG_MAX_CONCURRENCY: 1

    steps:
      - uses: actions/checkout@v6

      - name: Setup Cache
        uses: ./.github/actions/setup_cache
        with:
          compiler: ${{ matrix.compiler }}
          build_type: ${{ matrix.build_type }}
          generator: ${{ matrix.generator }}

      - name: Project Name
        uses: cardinalby/export-env-action@v2
        with:
          envFile: '.github/constants.env'

      - name: Setup Cpp
        uses: aminya/setup-cpp@v1
        with:
          compiler: ${{ matrix.compiler }}
          vcvarsall: ${{ contains(matrix.os, 'windows' )}}
          cmake: true
          ninja: true
          vcpkg: true
          ccache: true

      - name: Configure CMake
        run: >
          cmake -S . -B ./out/build/${{ matrix.build_type }}
          -G "${{ matrix.generator }}"
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake"
          -DENABLE_CLANG_TIDY_DEFAULT:BOOL=OFF
          -D${{ env.PROJECT_NAME }}_ENABLE_IPO:BOOL=ON
          -D${{ env.PROJECT_NAME }}_PACKAGING_MAINTAINER_MODE:BOOL=ON
          -DGIT_SHA:STRING=${{ github.sha }}

      - name: Build
        run: cmake --build ./out/build/${{ matrix.build_type }} --config ${{ matrix.build_type }}

      - name: Pack release
        if: matrix.package_generator != ''
        working-directory: ./out/build/${{ matrix.build_type }}
        run: cpack -C ${{ matrix.build_type }} -G ${{ matrix.package_generator }}

      - name: Publish artifacts
        if: matrix.package_generator != ''
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.PROJECT_NAME }}-${{ matrix.os }}
          path: |
            ./out/build/${{ matrix.build_type }}/_CPack_Packages/Linux/TGZ/**/*
            ./out/build/${{ matrix.build_type }}/_CPack_Packages/win64/ZIP/**/*
            ! ./out/build/${{ matrix.build_type }}/_CPack_Packages/Linux/TGZ/*.tar.gz
            ! ./out/build/${{ matrix.build_type }}/_CPack_Packages/win64/ZIP/*.zip
          overwrite: true
